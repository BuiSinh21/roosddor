# Server block cho landing page tinh. Tuong duong voi web.config cu (ban IIS):
# default document, cache anh, MIME .avif.
server {
    listen 3020;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # [QUAN TRONG] "types {}" khai trong server se THAY THE toan bo bang MIME ke thua tu
    # http{} chu khong cong don - thieu dong include nay thi MOI file (ke ca index.html)
    # mat MIME dung, roi ve default_type (application/octet-stream) va trinh duyet tai
    # ve thay vi render. Phai include lai bang goc roi moi them .avif.
    include /etc/nginx/mime.types;
    types {
        image/avif avif;
    }

    location /image/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
